name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Public, non-secret placeholders so the build can run in CI.
      # CI never talks to a real Supabase project in M1.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_not_a_real_key
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run check:migrations
      - run: npm run build
      - run: npm run check:bundle

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  database-postgres-17:
    name: Database tests on PostgreSQL 17 (real server, concurrency)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Disposable server that exists only for this job. Supabase runs PostgreSQL 17.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A throw-away database inside the job's own container. Never a Supabase project.
      STATEADV_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Show the PostgreSQL version being tested
        run: node scripts/pg-version.mjs
      - name: All database tests on real PostgreSQL 17
        run: npx vitest run tests/db --exclude tests/db/concurrency.pg.test.ts
      # The simultaneous-request tests open dozens of connections at once: run them alone, not next to other test files.
      - name: Concurrency tests on real PostgreSQL 17 (many connections at the same moment)
        run: npx vitest run tests/db/concurrency.pg.test.ts

  database-postgres-17-restricted:
    name: Database tests on PostgreSQL 17 as a NON-superuser (like Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          # The server's superuser is called bootstrap, so that the migrations can run as a plain role named postgres,
          # which is what Supabase gives us (no superuser rights).
          POSTGRES_USER: bootstrap
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bootstrap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      STATEADV_PG_URL: postgres://bootstrap:postgres@localhost:5432/postgres
      STATEADV_PG_RESTRICTED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Show the PostgreSQL version being tested
        run: node scripts/pg-version.mjs
      - name: All database tests, migrations run as a plain (non-superuser) role
        run: npx vitest run tests/db --exclude tests/db/concurrency.pg.test.ts
      - name: Concurrency tests, same setup
        run: npx vitest run tests/db/concurrency.pg.test.ts
